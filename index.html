<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102d43">
<title>WAYBRIDGE | Ground Transport Platform</title>
<style>
:root{--navy:#102d43;--teal:#168b87;--teal2:#20aaa2;--ink:#1b2b38;--muted:#6e7d89;--line:#e5ebef;--bg:#f5f8fa;--white:#fff;--amber:#b7791f;--red:#c2413b;--green:#16804a;--shadow:0 8px 28px rgba(16,45,67,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:650;background:var(--teal);color:#fff}button:hover{filter:brightness(.96)}button.secondary{background:#edf3f5;color:var(--navy);border:1px solid var(--line)}button.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}button.danger{background:#fff1f0;color:var(--red);border:1px solid #f4cecb}button.small{padding:7px 10px;font-size:12px}.shell{min-height:100vh}.top{height:68px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10;box-shadow:0 3px 14px #102d4325}.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:1.4px;font-size:20px}.mark{width:35px;height:35px;border-radius:10px;background:var(--teal2);display:grid;place-items:center;font-size:19px}.top-right{display:flex;gap:10px;align-items:center}.top small{color:#b9ccd5}.workspace-select{background:#29475b;color:white;border:1px solid #456174;padding:9px 12px;border-radius:9px}.layout{display:grid;grid-template-columns:240px 1fr;max-width:1600px;margin:auto}.sidebar{background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 68px);padding:22px 14px;position:sticky;top:68px;height:calc(100vh - 68px)}.tenant{padding:8px 12px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}.tenant b{display:block}.tenant span{font-size:12px;color:var(--muted)}.nav-label{font-size:10px;color:#9aa6ae;font-weight:800;letter-spacing:1.2px;padding:10px 12px}.nav button{display:flex;width:100%;text-align:left;align-items:center;gap:11px;background:transparent;color:#536371;font-weight:600;margin:3px 0;padding:11px 12px}.nav button.active{background:#e8f5f4;color:#087b76}.nav button:hover{background:#f2f7f8}.main{padding:28px;max-width:1300px;width:100%;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.eyebrow{font-size:11px;color:var(--teal);font-weight:800;letter-spacing:1.2px;text-transform:uppercase}.page-head h1{margin:5px 0;font-size:27px;color:var(--navy);letter-spacing:-.6px}.sub{color:var(--muted);font-size:13px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.stat-label{font-size:12px;color:var(--muted)}.stat-value{font-size:27px;font-weight:800;color:var(--navy);margin:8px 0 4px}.stat-foot{font-size:11px;color:var(--muted)}.section-title{font-size:15px;font-weight:800;color:var(--navy);margin:0 0 14px}.two{grid-template-columns:1.25fr .75fr}.three{grid-template-columns:repeat(3,1fr)}.bar{height:8px;background:#edf1f3;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:var(--teal);border-radius:99px}.bar.warn span{background:#d49a3a}.dept{margin:15px 0}.dept-line{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}.muted{color:var(--muted)}.pill{display:inline-flex;align-items:center;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:750;background:#edf3f5;color:#536371}.pill.green{background:#e7f6ed;color:var(--green)}.pill.amber{background:#fff4df;color:#986313}.pill.red{background:#fff0ef;color:var(--red)}.pill.blue{background:#eaf2ff;color:#345c9b}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;color:#71808b;background:#f7f9fa;font-size:10px;letter-spacing:.6px;text-transform:uppercase;padding:12px 10px;white-space:nowrap}td{padding:13px 10px;border-top:1px solid var(--line);vertical-align:middle}tr.clickable{cursor:pointer}tr.clickable:hover{background:#f7fbfb}.money{font-weight:750;color:var(--navy)}.actions{display:flex;gap:8px;flex-wrap:wrap}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;font-weight:750;color:#52616d}.field input,.field select,.field textarea,.searchbox{width:100%;padding:11px 12px;border:1px solid #dce4e9;border-radius:9px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #168b8718}.field.full{grid-column:1/-1}.radio-row{display:flex;gap:10px;flex-wrap:wrap}.radio{border:1px solid var(--line);border-radius:9px;padding:10px 13px;font-size:12px;display:flex;gap:8px;align-items:center}.radio input{accent-color:var(--teal)}.vehicle{display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid var(--line);padding:15px;border-radius:12px;margin-top:10px}.vehicle h3{font-size:14px;margin:0 0 5px}.vehicle p{font-size:11px;color:var(--muted);margin:0}.vehicle-price{text-align:right;font-size:19px;font-weight:800;color:var(--navy)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{background:#fff;color:#5d6d78;border:1px solid var(--line)}.tabs button.active{background:#e7f5f4;color:#087b76;border-color:#bfe3e0}.notice{padding:12px 14px;border-radius:10px;background:#eaf6f3;color:#116b56;font-size:12px;margin-bottom:16px;border:1px solid #cce9df}.warning-box{background:#fff7e8;border:1px solid #f0ddb5;color:#765016;padding:13px;border-radius:11px;font-size:12px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail{background:#f7f9fa;border-radius:9px;padding:11px}.detail span{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.detail b{font-size:13px}.progress{display:flex;gap:6px;margin:12px 0}.progress span{height:4px;background:#e7ecef;border-radius:99px;flex:1}.progress span.done{background:var(--teal)}.empty{padding:28px;text-align:center;color:var(--muted)}.footer{text-align:center;color:#9aa6ae;font-size:10px;padding:25px}.mobile-menu{display:none}.hidden{display:none!important}
@media(max-width:950px){.layout{grid-template-columns:190px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.main{padding:20px}}
@media(max-width:680px){.top{padding:0 14px}.top small{display:none}.brand{font-size:17px}.layout{display:block}.sidebar{position:static;height:auto;min-height:0;padding:10px;border-right:0;border-bottom:1px solid var(--line)}.tenant,.nav-label{display:none}.nav{display:flex;overflow:auto;gap:5px}.nav button{width:auto;white-space:nowrap;padding:9px 11px;font-size:11px}.main{padding:16px}.page-head h1{font-size:23px}.stats{gap:9px}.card{padding:14px}.stat-value{font-size:23px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.detail-grid{grid-template-columns:1fr 1fr}.vehicle{align-items:flex-start}.vehicle-price{font-size:17px}}
</style>
</head>
<body>
<div class="shell">
<header class="top">
  <div class="brand"><div class="mark">↗</div> WAYBRIDGE</div>
  <div class="top-right"><small>GLOBAL GROUND TRANSPORT</small><select class="workspace-select" id="workspace"><option>Corporate</option><option>Agency</option><option>Operations</option></select><span>◉</span></div>
</header>
<div class="layout">
<aside class="sidebar">
  <div class="tenant"><b id="tenantName">Acme Technologies</b><span id="tenantMeta">Corporate workspace · INR</span></div>
  <div class="nav-label">WORKSPACE</div>
  <nav class="nav" id="nav"></nav>
</aside>
<main class="main" id="app"></main>
</div>
<div class="footer">WAYBRIDGE · Interactive product prototype · Demo data only · No live bookings or payments</div>
</div>
<script>
const $=s=>document.querySelector(s);
const money=n=>'₹'+Number(n).toLocaleString('en-IN');
let workspace='Corporate',page='Dashboard',notice='',selectedApproval=0,approved=[],rejected=[],searchOffers=false,bookingStage=0,booking={},budgetRows=[
 {name:'Sales',allocated:500000,spent:390000,committed:45000},
 {name:'Operations',allocated:500000,spent:260000,committed:60000},
 {name:'Finance',allocated:500000,spent:170000,committed:35000},
 {name:'Management',allocated:500000,spent:320000,committed:70000}
];
const approvals=[
 {id:'WB-1024',employee:'Ananya Kumar',dept:'Sales',route:'BLR Airport → Leela Palace',date:'20 Nov · 10:30',amount:2600,available:1500,reason:'Client meeting at the hotel; premium pickup requested.',age:'18 min'},
 {id:'WB-1025',employee:'Rahul Shah',dept:'Finance',route:'Office → Bengaluru Airport',date:'21 Nov · 06:00',amount:4800,available:2800,reason:'Early airport transfer for an overseas audit.',age:'2 hr'},
 {id:'WB-1026',employee:'Meera Nair',dept:'Operations',route:'Airport → Whitefield',date:'22 Nov · 14:15',amount:3200,available:2000,reason:'Customer site visit with two colleagues.',age:'4 hr'}
];
const menus={
 Corporate:['Dashboard','Search & Book','My Bookings','Approvals','Budgets','Employees','Reports','Settings'],
 Agency:['Dashboard','Search & Book','Bookings','Customers','Agents','Credit & Wallet','Reports','Settings'],
 Operations:['Dashboard','Booking Monitor','Exceptions','Suppliers','Notifications','Reports','Settings']
};
function setNotice(t){notice=t;render()}
function go(p){page=p;notice='';render()}
function header(title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">${workspace} workspace</div><h1>${title}</h1><div class="sub">${sub}</div></div>${action}</div>`}
function stats(items){return `<div class="grid stats">${items.map(x=>`<div class="card"><div class="stat-label">${x[0]}</div><div class="stat-value">${x[1]}</div><div class="stat-foot">${x[2]||''}</div></div>`).join('')}</div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function badge(s){let c=s==='Confirmed'||s==='Connected'?'green':s.includes('Pending')||s==='Sandbox'?'amber':s==='Failed'||s==='Unknown'?'red':'blue';return `<span class="pill ${c}">${s}</span>`}
function shell(content){$('#app').innerHTML=(notice?`<div class="notice">✓ ${notice}</div>`:'')+content}
function renderNav(){ $('#nav').innerHTML=menus[workspace].map((n,i)=>`<button class="${page===n?'active':''}" onclick="go('${n}')"><span>${['▦','⌕','▤','✓','◫','♙','▥','⚙'][i]}</span>${n}</button>`).join('');}
function dashboard(){
 if(workspace==='Corporate'){
  const total=budgetRows.reduce((s,x)=>s+x.allocated,0),spent=budgetRows.reduce((s,x)=>s+x.spent,0),comm=budgetRows.reduce((s,x)=>s+x.committed,0);
  return header('Corporate dashboard','Budget overview · November 2026',`<button class="secondary" onclick="go('Reports')">View reports</button>`)+stats([['Allocated budget',money(total),'Across 4 departments'],['Actual spent',money(spent),'51.2% utilized'],['Active committed',money(comm),'Approved bookings'],['Available budget',money(total-spent-comm),'Current period']])+`<div class="grid two"><section class="card"><h2 class="section-title">Department budget utilization</h2>${budgetRows.map(d=>{let pct=Math.round(d.spent/d.allocated*100);return `<div class="dept"><div class="dept-line"><b>${d.name}</b><span>${money(d.spent)} / ${money(d.allocated)} · ${pct}%</span></div><div class="bar ${pct>=75?'warn':''}"><span style="width:${pct}%"></span></div></div>`}).join('')}</section><section class="card"><h2 class="section-title">Action centre</h2><div class="detail-grid"><div class="detail"><span>Pending approvals</span><b>12 requests</b></div><div class="detail"><span>Budget alerts</span><b>2 departments</b></div><div class="detail"><span>Bookings this month</span><b>148</b></div><div class="detail"><span>Policy exceptions</span><b>6 requests</b></div></div><br><button onclick="go('Approvals')">Open manager inbox</button></section></div>`;
 }
 if(workspace==='Agency')return header('Agency dashboard','Sales and operations overview · November 2026',`<button onclick="go('Search & Book')">+ New booking</button>`)+stats([['Bookings this month','386','+12.4% vs last month'],['Gross sales','₹18.6L','INR · demo'],['Gross markup','₹2.1L','11.3% average'],['Credit available','₹7.4L','Of ₹10L limit']])+`<section class="card"><h2 class="section-title">Recent agency bookings</h2>${bookingRows()}</section>`;
 return header('Operations control tower','Live booking and supplier health · Demo data')+stats([['Active bookings','1,284','Across all tenants'],['Open exceptions','24','Needs attention'],['Supplier success','96.2%','Rolling 30 days'],['Pending confirmation','8','Reconciliation required']])+`<section class="card"><h2 class="section-title">Operational alerts</h2>${[['Supplier confirmation unknown','4','red'],['Driver details delayed','5','amber'],['Notification delivery failed','7','amber'],['Supplier pending','8','blue']].map(a=>`<div class="dept-line"><b>${a[0]}</b>${badge(a[1]+' cases')}</div>`).join('')}<button onclick="go('Exceptions')">Open exception queue</button></section>`;
}
function bookingRows(){return table(['Booking','Journey','Date','Amount','Status',''],[
['WB-2048','BLR Airport → Leela Palace','20 Nov · 10:30','₹2,600','Confirmed'],
['WB-2047','Office → BLR Airport','21 Nov · 06:00','₹4,800','Supplier pending'],
['WB-2046','BLR Airport → Whitefield','22 Nov · 14:15','₹3,200','Completed']
].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td class="money">${r[3]}</td><td>${badge(r[4])}</td><td><button class="small secondary" onclick="setNotice('Opened sample booking ${r[0]}.')">View</button></td></tr>`))}
function searchPage(){return header('Search ground transport','Compare vehicle options across connected suppliers')+`<section class="card"><div class="tabs"><button class="active">Airport transfer</button><button class="secondary">Point to point</button><button class="secondary">Hourly hire</button></div><div class="form-grid">
<div class="field"><label>Pickup location</label><input id="pickup" value="Bengaluru Airport (BLR)"></div><div class="field"><label>Drop-off location</label><input id="dropoff" value="The Leela Palace, Bengaluru"></div>
<div class="field"><label>Pickup date</label><input id="date" type="date" value="2026-11-20"></div><div class="field"><label>Pickup time</label><input id="time" type="time" value="10:30"></div>
<div class="field"><label>Pickup mode</label><select id="mode"><option>Flight-based</option><option>Fixed time</option></select></div><div class="field"><label>Passengers</label><select id="pax"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div>
<div class="field"><label>Flight number (optional)</label><input id="flight" placeholder="e.g. 6E 501"></div><div class="field"><label>Vehicle preference</label><select id="vehicle"><option>Any vehicle</option><option>Business Sedan</option><option>Premium Sedan</option><option>SUV</option><option>Van</option></select></div></div><br><button onclick="searchOffers=true;render()">⌕ Search rides</button></section>
${searchOffers?`<br><h2 class="section-title">Available demo offers</h2>${[['Business Sedan','3 passengers · 2 bags','Global Mobility','₹2,600'],['Premium Sedan','3 passengers · 2 bags','City Executive','₹3,100'],['SUV','6 passengers · 4 bags','Premium Transfers','₹4,200']].map(v=>`<div class="vehicle"><div><h3>${v[0]}</h3><p>${v[1]} · ${v[2]} · Sample inventory</p><p>Supplier cancellation and waiting terms apply.</p></div><div><div class="vehicle-price">${v[3]}</div><button class="small" onclick="chooseVehicle('${v[0]}','${v[3]}')">Select</button></div></div>`).join('')}`:''}`}
function chooseVehicle(name,price){booking={pickup:$('#pickup').value,dropoff:$('#dropoff').value,date:$('#date').value,time:$('#time').value,mode:$('#mode').value,pax:$('#pax').value,flight:$('#flight').value,vehicle:name,price};go('Booking Review')}
function bookingReview(){return header('Review booking request','Check trip details and commercial summary before submitting')+`<div class="grid two"><section class="card"><h2 class="section-title">Journey details</h2><div class="detail-grid"><div class="detail"><span>Pickup</span><b>${booking.pickup||'Bengaluru Airport (BLR)'}</b></div><div class="detail"><span>Drop-off</span><b>${booking.dropoff||'The Leela Palace'}</b></div><div class="detail"><span>Date and time</span><b>${booking.date||'20 Nov 2026'} · ${booking.time||'10:30'}</b></div><div class="detail"><span>Pickup mode</span><b>${booking.mode||'Flight-based'}</b></div><div class="detail"><span>Passengers</span><b>${booking.pax||'2'}</b></div><div class="detail"><span>Vehicle</span><b>${booking.vehicle||'Business Sedan'}</b></div></div><br><div class="field"><label>Passenger / lead traveller</label><input placeholder="Passenger name"></div><div class="field"><label>Contact number</label><input placeholder="+91"></div></section><section class="card"><h2 class="section-title">Price summary</h2><div class="dept-line"><span>Supplier fare</span><b>₹2,400</b></div><div class="dept-line"><span>Taxes and fees</span><b>₹200</b></div><hr style="border:0;border-top:1px solid var(--line)"><div class="dept-line"><b>Total</b><b class="money">${booking.price||'₹2,600'}</b></div>${workspace==='Corporate'?`<div class="warning-box">Budget check: available ₹1,500. This request exceeds budget by ₹1,100 and requires manager approval. No supplier request will be sent until approval.</div><br><div class="field"><label>Business justification</label><textarea id="justification" rows="3" placeholder="Explain the business purpose"></textarea></div>`:`<div class="field"><label>Payment method</label><select><option>Agency credit</option><option>Prepaid wallet</option><option>Online gateway</option></select></div>`}<br><button onclick="submitBooking()"> ${workspace==='Corporate'?'Submit for approval':'Create booking request'}</button></section></div>`}
function submitBooking(){if(workspace==='Corporate'&&!$('#justification').value.trim()){alert('Please enter a business justification.');return}setNotice(workspace==='Corporate'?'Request submitted as PENDING_APPROVAL. No supplier booking has been created.':'Demo booking request created. No live supplier booking or payment was made.');go(workspace==='Corporate'?'My Bookings':'Bookings')}
function approvalsPage(){let pending=approvals.filter((a,i)=>!approved.includes(i)&&!rejected.includes(i));let a=approvals[selectedApproval]||approvals[0];return header('Manager approval inbox','Review booking requests requiring budget or policy approval')+stats([['Pending requests',pending.length,'Demo queue'],['Escalated','2','SLA breached'],['Approved by you',approved.length,'This session'],['Rejected by you',rejected.length,'This session']])+`<div class="grid two"><section class="card"><h2 class="section-title">Pending requests</h2>${pending.map((x)=>{let i=approvals.indexOf(x);return `<div class="dept" style="padding:10px;border:1px solid ${i===selectedApproval?'#168b87':'#e5ebef'};border-radius:10px;cursor:pointer" onclick="selectedApproval=${i};render()"><div class="dept-line"><b>${x.employee}</b>${badge('Pending')}</div><div class="sub">${x.id} · ${x.dept} · ${x.age}</div><p style="font-size:12px">${x.route}</p><div class="dept-line"><b>${money(x.amount)}</b><span style="color:#c2413b">Excess ${money(x.amount-x.available)}</span></div></div>`}).join('')||'<div class="empty">No pending demo requests.</div>'}</section><section class="card"><h2 class="section-title">Request details · ${a.id}</h2><div class="detail-grid"><div class="detail"><span>Employee</span><b>${a.employee}</b></div><div class="detail"><span>Department</span><b>${a.dept}</b></div><div class="detail"><span>Requested</span><b>${money(a.amount)}</b></div><div class="detail"><span>Available</span><b>${money(a.available)}</b></div></div><br><div class="warning-box">Budget excess: <b>${money(a.amount-a.available)}</b></div><br><b style="font-size:12px">Employee justification</b><p class="sub">${a.reason}</p><div class="field"><label>Manager comments</label><textarea id="managerComment" rows="3" placeholder="Required for rejection; recommended for approval"></textarea></div><br><div class="actions"><button onclick="decision('approve',${selectedApproval})">Approve & reserve budget</button><button class="danger" onclick="decision('reject',${selectedApproval})">Reject request</button></div><p class="sub">Approval authorizes supplier submission; it does not confirm the ride. Production requires server-side authorization and atomic reservation.</p></section></div>`}
function decision(type,i){let c=$('#managerComment').value.trim();if(!c){alert('Please enter decision comments.');return}if(type==='approve')approved.push(i);else rejected.push(i);notice=`${approvals[i].id} ${type}d in this demo. No live supplier request was sent.`;render()}
function budgetsPage(){return header('Department budgets','Manage allocations, commitments and approval thresholds',`<button onclick="openBudgetForm()">+ Allocate budget</button>`)+stats([['Allocated',money(budgetRows.reduce((s,x)=>s+x.allocated,0)),'4 departments'],['Actual spent',money(budgetRows.reduce((s,x)=>s+x.spent,0)),'Posted expenditure'],['Committed',money(budgetRows.reduce((s,x)=>s+x.committed,0)),'Approved bookings'],['Pending approval','₹1.18L','Displayed separately']])+`<section class="card"><h2 class="section-title">Department allocations</h2>${table(['Department','Period','Allocated','Actual spent','Committed','Available','Utilization'],budgetRows.map(d=>`<tr><td><b>${d.name}</b></td><td>Monthly</td><td>${money(d.allocated)}</td><td>${money(d.spent)}</td><td>${money(d.committed)}</td><td class="money">${money(d.allocated-d.spent-d.committed)}</td><td>${Math.round(d.spent/d.allocated*100)}%</td></tr>`))}</section><div id="budgetForm" class="card hidden" style="margin-top:16px"><h2 class="section-title">Allocate department budget</h2><div class="form-grid"><div class="field"><label>Department</label><select id="budgetDept"><option>Sales</option><option>Operations</option><option>Finance</option><option>Management</option></select></div><div class="field"><label>Period</label><select><option>Monthly</option><option>Quarterly</option><option>Annual</option></select></div><div class="field"><label>Allocation (INR)</label><input id="budgetAmount" type="number" value="500000"></div><div class="field"><label>Alert thresholds</label><input value="75%, 90%, 100%"></div></div><br><button onclick="saveBudget()">Save allocation</button></div>`}
function openBudgetForm(){$('#budgetForm').classList.toggle('hidden')}
function saveBudget(){let n=$('#budgetDept').value,a=Number($('#budgetAmount').value);if(a<=0)return alert('Enter a valid allocation');let d=budgetRows.find(x=>x.name===n);d.allocated=a;setNotice(`${n} budget allocation updated in local demo state.`)}
function simplePage(){let content={
'My Bookings':bookingRows(),'Bookings':bookingRows(),
'Employees':table(['Employee','ID','Department','Manager','Status'],[['Ananya Kumar','EMP-102','Sales','A. Menon',badge('Active')],['Rahul Shah','EMP-108','Finance','S. Rao',badge('Active')],['Meera Nair','EMP-116','Operations','R. Das',badge('Active')]].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`)),
